name: Docker - Beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-beta
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 获取项目源代码
      - name: Checkout
        uses: actions/checkout@v7

      # 2. 读取版本号
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION_FILE="./service/assets/version"

          if [ ! -f "$VERSION_FILE" ]; then
            echo "Error: Version file not found"
            exit 1
          fi

          APP_VERSION=$(cut -d '|' -f 2 "$VERSION_FILE" | tr -d '\r\n[:space:]')

          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version: $APP_VERSION"
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"

      # 3. 设置构建环境
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 4. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 构建并推送测试版
      - name: Build and push beta
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE_NAME }}:${{ steps.version.outputs.APP_VERSION }}-beta
          cache-from: type=gha
          cache-to: type=gha,mode=max
